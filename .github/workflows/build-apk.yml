name: Build Android APK

on:
  push:
    branches: [master, main]
    tags: ["android-v*", "app-v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # App 通过组合构建引用独立的 SDK 仓库；CI 里把它 checkout 到 _sdk。
      - name: Checkout native UI SDK
        uses: actions/checkout@v7
        with:
          repository: EricFL1998/dsh-mobile-plugin-sdk
          path: _sdk

      # Signing material comes from repository secrets. Without them the workflow still
      # builds a debug APK, so forks and PRs keep working.
      - name: Decode signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets; building debug APK"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          {
            echo "storeFile=keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "SIGNED_BUILD=true" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      # 发版守卫：APK 引用的 bridge / rootfs 版本必须已经真正发布。
      # 缺失 bridge release 时，如果配置了 BRIDGE_RELEASE_TOKEN，会自动触发
      # bridge 仓库的 release workflow；没有 token 就失败，避免 APK 指向一个
      # 设备无法更新到的插件版本。发布链条见 RELEASING.md。
      - name: Verify bridge and rootfs releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          BRIDGE_DISPATCH_TOKEN: ${{ secrets.BRIDGE_RELEASE_TOKEN }}
        run: python3 .github/scripts/verify-release-coupling.py

      - name: Build APK
        run: |
          if [ "${{ env.SIGNED_BUILD }}" = "true" ]; then
            ./gradlew :app:assembleRelease --no-daemon --stacktrace -PdshSdkRepo="$GITHUB_WORKSPACE/_sdk"
          else
            ./gradlew :app:assembleDebug --no-daemon --stacktrace -PdshSdkRepo="$GITHUB_WORKSPACE/_sdk"
          fi

      - name: Prepare artifact name
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          if [ "${{ env.SIGNED_BUILD }}" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/dsh-mobile-${VERSION}-release.apk"
            echo "flavor=release" >> "$GITHUB_OUTPUT"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "dist/dsh-mobile-${VERSION}-debug.apk"
            echo "flavor=debug" >> "$GITHUB_OUTPUT"
          fi
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: dsh-mobile-${{ steps.apk.outputs.flavor }}-${{ steps.apk.outputs.version }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

