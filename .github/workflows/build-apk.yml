name: Build Android APK

on:
  push:
    branches: [master, main]
    tags: ["android-v*", "app-v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # App 通过组合构建引用独立的 SDK 仓库；CI 里把它 checkout 到 _sdk。
      - name: Checkout native UI SDK
        uses: actions/checkout@v4
        with:
          repository: EricFL1998/dsh-mobile-plugin-sdk
          path: _sdk

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace -PdshSdkRepo="$GITHUB_WORKSPACE/_sdk"

      - name: Prepare artifact name
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/dsh-mobile-${VERSION}-debug.apk"
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-debug-${{ steps.apk.outputs.version }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

